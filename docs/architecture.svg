<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="56" fill="url(#hdr)"/>
  <text x="24" y="36" fill="#fff" font-size="23" font-weight="bold">💸 Recovery Agent — Autonomous Revenue Recovery on AWS CDS</text>

  <!-- Inbound -->
  <text x="24" y="90" fill="#1e293b" font-size="13" font-weight="bold">INBOUND — customer replies (AWS CDS)</text>
  <g>
    <rect x="24" y="100" width="150" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="99" y="122" text-anchor="middle" font-size="13" font-weight="bold">📱 SMS</text><text x="99" y="140" text-anchor="middle" font-size="10" fill="#92400e">EUM two-way</text>
    <rect x="192" y="100" width="150" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="267" y="122" text-anchor="middle" font-size="13" font-weight="bold">💬 RCS</text><text x="267" y="140" text-anchor="middle" font-size="10" fill="#1e40af">EUM</text>
    <rect x="360" y="100" width="150" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="435" y="122" text-anchor="middle" font-size="13" font-weight="bold">📲 WhatsApp</text><text x="435" y="140" text-anchor="middle" font-size="10" fill="#15803d">EUM Social</text>
    <rect x="528" y="100" width="150" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="603" y="122" text-anchor="middle" font-size="13" font-weight="bold">📧 Email</text><text x="603" y="140" text-anchor="middle" font-size="10" fill="#115e59">Amazon SES</text>
  </g>

  <!-- Triage (inbound intelligence) -->
  <rect x="192" y="188" width="486" height="60" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2.5"/>
  <text x="435" y="212" text-anchor="middle" font-size="14" font-weight="bold">🧠 Message Triage — Bedrock Nova 2 Lite</text>
  <text x="435" y="232" text-anchor="middle" font-size="11" fill="#a21caf">classifies intent (promise · plan · dispute · hardship · opt-out · churn) + urgency + sentiment + needsHuman</text>
  <line x1="99" y1="152" x2="300" y2="188" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="267" y1="152" x2="380" y2="188" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="435" y1="152" x2="470" y2="188" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="603" y1="152" x2="560" y2="188" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="192" y="292" width="340" height="168" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="362" y="316" text-anchor="middle" font-size="15" font-weight="bold">🤖 Agent Orchestrator</text>
  <text x="362" y="334" text-anchor="middle" font-size="11" fill="#4338ca">Bedrock Nova 2 Lite · Converse + Tool Use</text>
  <line x1="212" y1="346" x2="512" y2="346" stroke="#c7d2fe"/>
  <text x="212" y="366" font-size="11" fill="#1e293b">• check_balance</text>
  <text x="212" y="384" font-size="11" fill="#1e293b">• offer_payment_plan · record_promise_to_pay</text>
  <text x="212" y="402" font-size="11" fill="#1e293b">• apply_hardship · log_dispute</text>
  <text x="212" y="420" font-size="11" fill="#1e293b">• send_receipt · escalate_to_human</text>
  <text x="212" y="444" font-size="10" fill="#4338ca" font-style="italic">compliance: no threats · honors opt-out · hardship-first</text>
  <line x1="435" y1="248" x2="400" y2="292" stroke="#c026d3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DynamoDB -->
  <rect x="580" y="292" width="200" height="168" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="680" y="316" text-anchor="middle" font-size="14" font-weight="bold">🗄️ DynamoDB</text>
  <line x1="600" y1="330" x2="760" y2="330" stroke="#a5f3fc"/>
  <text x="600" y="352" font-size="11" fill="#1e293b">• ra-accounts (the book)</text>
  <text x="600" y="372" font-size="11" fill="#1e293b">• ra-plans / promises</text>
  <text x="600" y="392" font-size="11" fill="#1e293b">• ra-conversations</text>
  <text x="600" y="420" font-size="10" fill="#0e7490" font-style="italic">one thread per customer,</text>
  <text x="600" y="434" font-size="10" fill="#0e7490" font-style="italic">all channels</text>
  <line x1="532" y1="360" x2="580" y2="360" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="388" x2="532" y2="388" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sender -->
  <rect x="192" y="500" width="486" height="52" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="435" y="524" text-anchor="middle" font-size="14" font-weight="bold">Channel Sender — replies on the customer's channel</text>
  <text x="435" y="542" text-anchor="middle" font-size="11" fill="#475569">EUM SMS/RCS · EUM Social WhatsApp · SES written confirmations</text>
  <line x1="362" y1="460" x2="400" y2="500" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outbound -->
  <text x="24" y="596" fill="#1e293b" font-size="13" font-weight="bold">OUTBOUND (AWS CDS)</text>
  <g>
    <rect x="24" y="606" width="150" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="99" y="636" text-anchor="middle" font-size="12" font-weight="bold">📱 SMS (EUM)</text>
    <rect x="192" y="606" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="267" y="636" text-anchor="middle" font-size="12" font-weight="bold">💬 RCS (EUM)</text>
    <rect x="360" y="606" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="435" y="636" text-anchor="middle" font-size="12" font-weight="bold">📲 WhatsApp</text>
    <rect x="528" y="606" width="150" height="50" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="603" y="636" text-anchor="middle" font-size="12" font-weight="bold">📧 SES</text>
  </g>
  <line x1="300" y1="552" x2="120" y2="606" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="552" x2="290" y2="606" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="470" y1="552" x2="450" y2="606" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="552" x2="590" y2="606" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Proactive -->
  <rect x="760" y="188" width="216" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="868" y="212" text-anchor="middle" font-size="13" font-weight="bold">⏰ Proactive Outreach</text>
  <text x="868" y="230" text-anchor="middle" font-size="10" fill="#9a3412">EventBridge — nudge past-due</text>
  <text x="868" y="246" text-anchor="middle" font-size="10" fill="#9a3412">accounts before suspension</text>
  <line x1="760" y1="238" x2="678" y2="516" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- ROI banner -->
  <rect x="700" y="470" width="276" height="84" rx="10" fill="#052e2b" stroke="#0f766e" stroke-width="2"/>
  <text x="838" y="496" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="bold">Business impact</text>
  <text x="838" y="518" text-anchor="middle" fill="#99f6e4" font-size="11">20% → 30% recovery on a</text>
  <text x="838" y="534" text-anchor="middle" fill="#99f6e4" font-size="11">$10M book = +$1M recovered,</text>
  <text x="838" y="550" text-anchor="middle" fill="#99f6e4" font-size="11">~70% fewer agent minutes</text>

  <text x="500" y="712" text-anchor="middle" font-size="11" fill="#94a3b8">All infrastructure in AWS CDK · Lambda (ARM64) · fully reproducible via `cdk deploy --all` · live-verified end-to-end</text>
</svg>
