<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="54" fill="url(#hdr)"/>
  <text x="24" y="35" fill="#fff" font-size="22" font-weight="bold">Recovery Agent — Escalation-Ladder Decision Flow</text>
  <text x="24" y="80" fill="#334155" font-size="13">Reach the customer on the <tspan font-weight="bold">cheapest channel that works</tspan>. Escalate only on silence. <tspan font-weight="bold" fill="#0f766e">Stop the instant they engage.</tspan></text>

  <!-- The 4 rungs, cost-ordered, each with day + cost + reason -->
  <!-- Rung 1 Email -->
  <rect x="60" y="104" width="620" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="80" y="130" font-size="15" font-weight="bold">📧  Email  ·  Day 0</text>
  <text x="80" y="150" font-size="12" fill="#115e59">Cheapest, least-intrusive first touch — Amazon SES</text>
  <text x="80" y="167" font-size="11" fill="#64748b" font-style="italic">reason: start at the lowest cost; nothing to lose</text>
  <rect x="548" y="120" width="112" height="38" rx="6" fill="#ccfbf1"/><text x="604" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">~$0.0001</text><text x="604" y="152" text-anchor="middle" font-size="9" fill="#115e59">per message</text>

  <text x="688" y="146" font-size="11" fill="#ea580c" font-weight="bold" text-anchor="middle">↓ no reply</text>
  <line x1="370" y1="174" x2="370" y2="196" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Rung 2 SMS -->
  <rect x="60" y="196" width="620" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="222" font-size="15" font-weight="bold">📱  SMS  ·  Day 3</text>
  <text x="80" y="242" font-size="12" fill="#92400e">Higher reach, read fast — AWS End User Messaging</text>
  <text x="80" y="259" font-size="11" fill="#64748b" font-style="italic">reason: 3 days silent on email → step up reach</text>
  <rect x="548" y="212" width="112" height="38" rx="6" fill="#fef3c7"/><text x="604" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">~$0.0075</text><text x="604" y="244" text-anchor="middle" font-size="9" fill="#92400e">per message</text>
  <text x="688" y="238" font-size="11" fill="#ea580c" font-weight="bold" text-anchor="middle">↓ no reply</text>
  <line x1="370" y1="266" x2="370" y2="288" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Rung 3 RCS -->
  <rect x="60" y="288" width="620" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="314" font-size="15" font-weight="bold">💬  RCS  ·  Day 7</text>
  <text x="80" y="334" font-size="12" fill="#1e40af">Rich tap-to-pay card — AWS EUM  (RCS→SMS fallback if unsupported)</text>
  <text x="80" y="351" font-size="11" fill="#64748b" font-style="italic">reason: still silent → richer, actionable format</text>
  <rect x="548" y="304" width="112" height="38" rx="6" fill="#dbeafe"/><text x="604" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">~$0.012</text><text x="604" y="336" text-anchor="middle" font-size="9" fill="#1e40af">per message</text>
  <text x="688" y="330" font-size="11" fill="#ea580c" font-weight="bold" text-anchor="middle">↓ no reply</text>
  <line x1="370" y1="358" x2="370" y2="380" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Rung 4 WhatsApp -->
  <rect x="60" y="380" width="620" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="406" font-size="15" font-weight="bold">📲  WhatsApp  ·  Day 10</text>
  <text x="80" y="426" font-size="12" fill="#15803d">Richest, most personal — EUM Social  (high-value / overdue only)</text>
  <text x="80" y="443" font-size="11" fill="#64748b" font-style="italic">reason: premium touch reserved for accounts worth the cost</text>
  <rect x="548" y="396" width="112" height="38" rx="6" fill="#dcfce7"/><text x="604" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">~$0.035</text><text x="604" y="428" text-anchor="middle" font-size="9" fill="#15803d">per message</text>

  <!-- Engagement stop -->
  <rect x="60" y="476" width="620" height="56" rx="10" fill="#052e2b" stroke="#0f766e" stroke-width="2"/>
  <text x="370" y="500" text-anchor="middle" fill="#2dd4bf" font-size="14" font-weight="bold">Customer replies on ANY rung →  escalation STOPS</text>
  <text x="370" y="519" text-anchor="middle" fill="#99f6e4" font-size="11">agent reasons &amp; acts: payment plan · promise-to-pay · hardship hold · dispute · opt-out</text>
  <line x1="370" y1="450" x2="370" y2="476" stroke="#0f766e" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Right column: signals that pick the channel -->
  <rect x="712" y="104" width="236" height="346" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="830" y="128" text-anchor="middle" font-size="13" font-weight="bold">What picks the channel</text>
  <line x1="728" y1="140" x2="932" y2="140" stroke="#e2e8f0"/>
  <text x="728" y="164" font-size="11" font-weight="bold">↩ Prior engagement</text>
  <text x="728" y="180" font-size="10" fill="#475569">reply where they last answered</text>
  <text x="728" y="206" font-size="11" font-weight="bold">💰 Account value / risk</text>
  <text x="728" y="222" font-size="10" fill="#475569">WhatsApp reserved for high-value</text>
  <text x="728" y="238" font-size="10" fill="#475569">or severely overdue accounts</text>
  <text x="728" y="264" font-size="11" font-weight="bold">📶 Device capability</text>
  <text x="728" y="280" font-size="10" fill="#475569">RCS → SMS fallback</text>
  <text x="728" y="306" font-size="11" font-weight="bold">🚫 Per-channel opt-out</text>
  <text x="728" y="322" font-size="10" fill="#475569">skip any channel they declined</text>
  <text x="728" y="348" font-size="11" font-weight="bold">🕗 Quiet hours</text>
  <text x="728" y="364" font-size="10" fill="#475569">no contact before 8am / after 9pm</text>
  <text x="728" y="380" font-size="10" fill="#475569">(FDCPA / Reg F — encoded)</text>
  <text x="728" y="414" font-size="10" fill="#0f766e" font-style="italic">Decided by a pure, tested</text>
  <text x="728" y="428" font-size="10" fill="#0f766e" font-style="italic">channel-strategy module.</text>

  <!-- Business impact strip -->
  <rect x="60" y="560" width="888" height="128" rx="12" fill="#0f172a"/>
  <text x="84" y="590" fill="#2dd4bf" font-size="15" font-weight="bold">Why it matters — the business case</text>
  <g font-size="12" fill="#e2e8f0">
    <text x="84" y="618">• Telecom = <tspan font-weight="bold" fill="#fff">&gt;1/5 of all U.S. debt-collection revenue</tspan>; the industry recovers only <tspan font-weight="bold" fill="#fff">~11%</tspan> of face value.</text>
    <text x="84" y="642">• Agent-assisted contact ≈ <tspan font-weight="bold" fill="#fff">$13.50</tspan> vs <tspan font-weight="bold" fill="#fff">$1.84</tspan> self-service (Gartner). This ladder resolves an account for <tspan font-weight="bold" fill="#2dd4bf">~$0.05</tspan>.</text>
    <text x="84" y="666">• Mature AI collections cut cost-to-collect <tspan font-weight="bold" fill="#fff">25–35%</tspan> (Deloitte) → a <tspan font-weight="bold" fill="#2dd4bf">seven-figure swing</tspan> on a $10M book, with recovery lift on top.</text>
  </g>
  <text x="500" y="726" text-anchor="middle" font-size="10" fill="#94a3b8">Sources: CFPB (2018) · ACA International · Gartner · Deloitte (2025) — see docs/RESEARCH_BRIEF.md</text>
</svg>
