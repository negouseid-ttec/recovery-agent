<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="54" fill="url(#hdr)"/>
  <text x="24" y="35" fill="#fff" font-size="22" font-weight="bold">Recovery Agent — Proactive Escalation Ladder</text>

  <!-- Trigger -->
  <rect x="330" y="86" width="340" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="108" text-anchor="middle" font-size="14" font-weight="bold">λ  ra-proactive-outreach</text>
  <text x="500" y="126" text-anchor="middle" font-size="10" fill="#9a3412">Amazon EventBridge — daily schedule</text>

  <!-- Decision node -->
  <rect x="330" y="166" width="340" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="500" y="188" text-anchor="middle" font-size="14" font-weight="bold">selectOutreachChannel(signals)</text>
  <text x="500" y="206" text-anchor="middle" font-size="10" fill="#4338ca">cheapest channel first · escalate only on silence</text>
  <line x1="500" y1="138" x2="500" y2="166" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Ladder -->
  <g text-anchor="middle">
    <rect x="300" y="248" width="400" height="46" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="500" y="270" font-size="13" font-weight="bold">Day 0 · 📧 Email</text><text x="500" y="286" font-size="10" fill="#115e59">~$0.0001 / message</text>
    <rect x="300" y="312" width="400" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="334" font-size="13" font-weight="bold">Day 3 · 📱 SMS</text><text x="500" y="350" font-size="10" fill="#92400e">~$0.0075 / message</text>
    <rect x="300" y="376" width="400" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="500" y="398" font-size="13" font-weight="bold">Day 7 · 💬 RCS</text><text x="500" y="414" font-size="10" fill="#1e40af">~$0.012 / message · RCS→SMS fallback</text>
    <rect x="300" y="440" width="400" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="500" y="462" font-size="13" font-weight="bold">Day 10 · 📲 WhatsApp</text><text x="500" y="478" font-size="10" fill="#15803d">~$0.035 · gated: ≥$400 OR 30+ days overdue</text>
  </g>
  <g stroke="#64748b" stroke-width="1.3">
    <line x1="500" y1="218" x2="500" y2="248" marker-end="url(#a)"/>
    <line x1="500" y1="294" x2="500" y2="312" marker-end="url(#a)"/>
    <line x1="500" y1="358" x2="500" y2="376" marker-end="url(#a)"/>
    <line x1="500" y1="422" x2="500" y2="440" marker-end="url(#a)"/>
  </g>

  <!-- Branch: engages -> stop -->
  <rect x="724" y="312" width="252" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="850" y="334" text-anchor="middle" font-size="12" font-weight="bold">Customer engages</text>
  <text x="850" y="351" text-anchor="middle" font-size="10" fill="#15803d">on ANY channel →</text>
  <text x="850" y="365" text-anchor="middle" font-size="10" fill="#15803d">STOP ladder, continue there</text>
  <line x1="700" y1="335" x2="724" y2="340" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Branch: quiet hours -->
  <rect x="24" y="312" width="252" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="334" text-anchor="middle" font-size="12" font-weight="bold">Quiet hours 9pm–8am</text>
  <text x="150" y="351" text-anchor="middle" font-size="10" fill="#475569">hold to email only</text>
  <text x="150" y="365" text-anchor="middle" font-size="10" fill="#475569">until the window reopens</text>
  <line x1="300" y1="340" x2="276" y2="340" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- opt-out note -->
  <rect x="300" y="508" width="400" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">⛔ per-channel opt-out honored</text>

  <text x="500" y="596" text-anchor="middle" font-size="11" fill="#94a3b8">Cheapest channel first · escalate only on silence · stop the instant the customer engages</text>
</svg>
