<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="54" fill="url(#hdr)"/>
  <text x="24" y="35" fill="#fff" font-size="22" font-weight="bold">Recovery Agent — Live Pipeline (AWS)</text>

  <text x="24" y="86" fill="#94a3b8" font-size="12" font-weight="bold">INBOUND — a customer replies on any channel</text>

  <!-- Inbound channels row -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="40"  y="98" width="200" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="140" y="121">📱 SMS</text><text x="140" y="138" font-size="10" font-weight="normal" fill="#92400e">End User Messaging</text>
    <rect x="268" y="98" width="200" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="368" y="121">💬 RCS</text><text x="368" y="138" font-size="10" font-weight="normal" fill="#1e40af">End User Messaging</text>
    <rect x="496" y="98" width="200" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="596" y="121">📲 WhatsApp</text><text x="596" y="138" font-size="10" font-weight="normal" fill="#15803d">EUM Social</text>
    <rect x="724" y="98" width="200" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="824" y="121">📧 Email</text><text x="824" y="138" font-size="10" font-weight="normal" fill="#115e59">Amazon SES</text>
  </g>

  <!-- API Gateway -->
  <rect x="40" y="186" width="884" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="482" y="207" text-anchor="middle" font-size="14" font-weight="bold">Amazon API Gateway</text>
  <text x="482" y="223" text-anchor="middle" font-size="10" fill="#64748b">one webhook per channel</text>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="140" y1="146" x2="260" y2="186" marker-end="url(#a)"/>
    <line x1="368" y1="146" x2="420" y2="186" marker-end="url(#a)"/>
    <line x1="596" y1="146" x2="540" y2="186" marker-end="url(#a)"/>
    <line x1="824" y1="146" x2="700" y2="186" marker-end="url(#a)"/>
  </g>

  <!-- Triage lambda -->
  <rect x="250" y="268" width="464" height="56" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="482" y="292" text-anchor="middle" font-size="14" font-weight="bold">λ  ra-message-triage</text>
  <text x="482" y="311" text-anchor="middle" font-size="11" fill="#a21caf">Bedrock Nova 2 Lite — intent · urgency · sentiment · needsHuman</text>
  <line x1="482" y1="230" x2="482" y2="268" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Orchestrator -->
  <rect x="190" y="362" width="420" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="387" text-anchor="middle" font-size="14" font-weight="bold">λ  ra-agent-orchestrator</text>
  <text x="400" y="406" text-anchor="middle" font-size="11" fill="#4338ca">Bedrock Nova 2 Lite · Converse + Tool Use</text>
  <line x1="482" y1="324" x2="430" y2="362" stroke="#c026d3" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- DynamoDB -->
  <rect x="660" y="360" width="280" height="64" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="800" y="385" text-anchor="middle" font-size="14" font-weight="bold">🗄️ Amazon DynamoDB</text>
  <text x="800" y="404" text-anchor="middle" font-size="11" fill="#0e7490">ra-accounts · ra-plans · ra-conversations</text>
  <line x1="610" y1="384" x2="660" y2="384" stroke="#0891b2" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="660" y1="404" x2="610" y2="404" stroke="#0891b2" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Channel sender -->
  <rect x="190" y="460" width="420" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="484" text-anchor="middle" font-size="14" font-weight="bold">λ  ra-channel-sender</text>
  <text x="400" y="503" text-anchor="middle" font-size="11" fill="#475569">EUM SMS/RCS · EUM Social WhatsApp · SES</text>
  <line x1="400" y1="422" x2="400" y2="460" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Outbound channels -->
  <text x="24" y="548" fill="#94a3b8" font-size="12" font-weight="bold">OUTBOUND — the agent replies on the same channel</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="40"  y="556" width="200" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="140" y="581">📱 SMS</text>
    <rect x="268" y="556" width="200" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="368" y="581">💬 RCS</text>
    <rect x="496" y="556" width="200" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="596" y="581">📲 WhatsApp</text>
    <rect x="724" y="556" width="200" height="40" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="824" y="581">📧 Email</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="300" y1="516" x2="150" y2="556" marker-end="url(#a)"/>
    <line x1="370" y1="516" x2="368" y2="556" marker-end="url(#a)"/>
    <line x1="440" y1="516" x2="580" y2="556" marker-end="url(#a)"/>
    <line x1="500" y1="516" x2="800" y2="556" marker-end="url(#a)"/>
  </g>

  <text x="500" y="612" text-anchor="middle" font-size="11" fill="#94a3b8">4 Lambdas (ARM64) · 4 AWS CDS services · AWS CDK · live-verified end-to-end</text>
</svg>
