name: Engineering checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CDK_DEFAULT_ACCOUNT: '111111111111'
      CDK_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DISABLE_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --coverage
      - run: npm run synth -- --all --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-synthesis
          path: |
            coverage/
            cdk.out/*.template.json
          if-no-files-found: warn
