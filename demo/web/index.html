<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recovery Agent — Omnichannel Escalation Ladder</title>
<style>
  :root { --sms:#f59e0b; --rcs:#2563eb; --wa:#25d366; --email:#0f766e; --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:radial-gradient(1200px 700px at 50% -10%,#1e293b,var(--bg)); color:var(--ink); min-height:100vh; }
  .topbar { text-align:center; padding:20px 20px 14px; }
  .topbar h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .gradient-text { background:linear-gradient(90deg,#2dd4bf,#60a5fa,#a78bfa); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .topbar p { color:var(--muted); font-size:13px; margin-top:6px; }

  /* two-column: sidebar + thread */
  .layout { display:flex; gap:0; max-width:900px; margin:0 auto; align-items:flex-start; }
  .sidebar { position:sticky; top:16px; width:250px; flex:0 0 250px; padding:16px; align-self:flex-start; }
  .sidebar h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:14px; }
  /* vertical stacked ladder */
  .ladder { display:flex; flex-direction:column; gap:0; }
  .rung { display:flex; align-items:flex-start; gap:10px; opacity:.4; transition:opacity .3s; }
  .rung.active { opacity:1; } .rung.done { opacity:.75; }
  .rung .railcol { display:flex; flex-direction:column; align-items:center; }
  .rung .dot { width:26px; height:26px; border-radius:50%; background:#1e293b; border:2px solid #334155; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:var(--muted); flex:0 0 auto; }
  .rung.active .dot { background:linear-gradient(135deg,#0f766e,#2563eb); border-color:#2dd4bf; color:#fff; }
  .rung.done .dot { background:#0f766e; border-color:#0f766e; color:#fff; font-size:0; }
  .rung.done .dot::after { content:'✓'; font-size:13px; }
  .rung .rail { width:2px; flex:1; min-height:26px; background:#334155; margin:2px 0; }
  .rung:last-child .rail { display:none; }
  .rung .meta { padding-bottom:16px; }
  .rung .meta .ch { font-size:13px; font-weight:700; color:var(--ink); }
  .rung .meta .day { font-size:11px; color:var(--muted); }
  .status-strip { display:flex; flex-direction:column; gap:7px; margin-top:18px; font-size:12px; color:var(--muted); }
  .status-strip .chip { background:var(--panel); border:1px solid #334155; border-radius:8px; padding:7px 11px; } .status-strip b { color:var(--ink); }

  /* timeline column (right) */
  .thread { flex:1; max-width:420px; padding:16px 16px 160px; display:flex; flex-direction:column; }
  .divider { text-align:center; margin:18px 0; position:relative; animation:fade .5s ease; }
  .divider::before { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:#334155; }
  .divider span { position:relative; background:#0f172a; padding:4px 14px; border:1px solid #334155; border-radius:999px; font-size:11px; color:var(--muted); font-style:italic; }
  @keyframes fade { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:none;} }

  /* reason banner above each phone */
  .reason { background:#052e2b; border:1px solid #0f766e; border-left:4px solid #2dd4bf; color:#99f6e4; border-radius:8px; padding:9px 14px; font-size:12px; line-height:1.4; margin:0 0 10px; animation:fade .4s ease; }
  .step-label { text-align:center; font-size:12px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .step-label .n { color:var(--muted); font-weight:500; margin-right:6px; }

  /* phone */
  .phone { width:340px; margin:0 auto 6px; background:#0b1220; border:9px solid #0b1220; border-radius:38px; box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 0 2px #1e293b; overflow:hidden; display:flex; flex-direction:column; animation:rise .45s ease; }
  @keyframes rise { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:none;} }
  .notch { height:22px; display:flex; align-items:center; justify-content:center; } .notch::after{content:'';width:84px;height:6px;background:#1e293b;border-radius:999px;}
  .app-bar { padding:10px 14px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; color:#fff; }
  .sms .app-bar{background:var(--sms);} .rcs .app-bar{background:var(--rcs);} .whatsapp .app-bar{background:#075e54;} .email .app-bar{background:var(--email);}
  .app-bar .avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .app-bar .sub{font-weight:400;font-size:11px;opacity:.9;display:block;}
  .screen { background:#0e1726; padding:14px; display:flex; flex-direction:column; gap:9px; min-height:150px; }
  .whatsapp .screen{background:#0b141a;} .email .screen{background:#f8fafc;}
  .bubble { max-width:86%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.45; word-wrap:break-word; animation:fade .3s ease; }
  .bubble.in{align-self:flex-start;background:#1e293b;color:var(--ink);border-bottom-left-radius:4px;}
  .bubble.out{align-self:flex-end;color:#fff;border-bottom-right-radius:4px;}
  .sms .bubble.out{background:var(--sms);} .rcs .bubble.out{background:var(--rcs);} .whatsapp .bubble.out{background:#005c4b;} .whatsapp .bubble.in{background:#1f2c33;}
  .bubble .who{font-size:10px;font-weight:700;opacity:.7;margin-bottom:2px;display:block;}
  .tool-chip{align-self:center;font-size:10px;color:var(--muted);background:rgba(148,163,184,.12);border:1px solid #334155;border-radius:999px;padding:3px 10px;font-family:monospace;}
  /* email */
  .email-msg{background:#fff;border-radius:10px;overflow:hidden;animation:fade .3s ease;}
  .email-head{padding:12px 14px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;}
  .email-head .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0f766e,#2dd4bf);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .email-head .name{font-weight:700;color:#0f172a;font-size:13px;} .email-head .addr{color:#64748b;font-size:11px;}
  .email-subject{padding:10px 14px 2px;font-weight:800;color:#0f172a;font-size:14px;}
  .email-body{padding:2px 14px 14px;color:#334155;font-size:12px;line-height:1.5;}
  .email-body .badge{display:inline-block;background:#ecfdf5;color:#065f46;border-left:3px solid #0f766e;padding:8px 10px;border-radius:4px;margin:8px 0;font-size:11px;}
  /* rich RCS card */
  .rich-card{align-self:stretch;background:#fff;color:#0f172a;border-radius:14px;overflow:hidden;animation:fade .3s ease;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .rich-card .rc-sender{display:flex;align-items:center;gap:6px;padding:9px 12px 0;font-size:11px;color:#1e40af;font-weight:700;}
  .rich-card .rc-verified{display:inline-flex;align-items:center;gap:3px;background:#dbeafe;color:#1e40af;border-radius:999px;padding:1px 7px;font-size:9px;font-weight:700;}
  .rich-card .rc-media{height:96px;background:linear-gradient(135deg,#2563eb,#1e40af);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;margin:8px 0 0;}
  .rich-card .rc-media .rc-amt{font-size:24px;font-weight:800;} .rich-card .rc-media .rc-cap{font-size:10px;opacity:.85;}
  .rich-card .rc-head{padding:10px 14px 2px;} .rich-card .rc-head .t{font-weight:800;font-size:14px;}
  .rich-card .rc-body{padding:4px 14px 10px;font-size:12px;line-height:1.45;}
  .rich-card .rc-actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
  .rich-card .chip{border:1.5px solid #2563eb;color:#2563eb;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;background:#fff;}
  .rich-card .chip.action{background:#2563eb;color:#fff;}
  .rich-card .rc-feat{border-top:1px solid #eef2ff;padding:8px 14px;font-size:9.5px;color:#64748b;display:flex;flex-wrap:wrap;gap:9px;}
  .rc-receipt{align-self:flex-start;font-size:10px;color:#2563eb;margin-top:2px;}
  .cost-tag{align-self:center;font-size:10px;color:var(--muted);margin-top:6px;}

  /* engaged / resolved banner */
  .resolved{max-width:360px;margin:14px auto 0;background:#052e2b;border:1px solid #0f766e;border-radius:12px;padding:14px 16px;text-align:center;animation:rise .45s ease;}
  .resolved .t{color:#2dd4bf;font-weight:800;font-size:14px;} .resolved .s{color:#99f6e4;font-size:11px;margin-top:4px;}

  /* controls (sticky bottom) */
  .controls{position:fixed;bottom:0;left:0;right:0;padding:16px;display:flex;gap:12px;justify-content:center;background:linear-gradient(0deg,#0f172a 70%,rgba(15,23,42,0));z-index:20;}
  button{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s;}
  button:hover{transform:translateY(-2px);} button:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  button.ghost{background:#1e293b;border:1px solid #334155;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>💸 <span class="gradient-text">Recovery Agent</span></h1>
    <p>Omnichannel escalation ladder — cheapest channel first, escalate only on silence, stop on engagement</p>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>Escalation path</h2>
      <div class="ladder" id="ladder"></div>
      <div class="status-strip">
        <div class="chip">Account <b>ACCT-TEL-80231</b></div>
        <div class="chip">Past due <b>$84.00</b></div>
        <div class="chip">Status <b id="st-status">past_due</b></div>
        <div class="chip">Outreach spend <b id="st-spend">$0.0000</b></div>
      </div>
    </aside>
    <div class="thread" id="thread"></div>
  </div>

  <div class="controls">
    <button class="ghost" id="prevBtn" onclick="prev()" disabled>‹ Back</button>
    <button id="nextBtn" onclick="next()">Step 1 of 5 — Start ›</button>
    <button class="ghost" onclick="location.reload()">↻ Reset</button>
  </div>

<script>
const COST = { email:0.0001, sms:0.0075, rcs:0.012, whatsapp:0.035 };
const LABEL = { email:'📧 Email', sms:'📱 SMS', rcs:'💬 RCS', whatsapp:'📲 WhatsApp' };
const SUB = {
  email:'Amazon SES · ~$0.0001/msg', sms:'AWS EUM · SMS · ~$0.0075/msg',
  rcs:'AWS EUM · RCS · ~$0.012/msg', whatsapp:'AWS EUM Social · WhatsApp · ~$0.035/msg' };

// Each STEP = a phone for one channel + the days-later gap that precedes it.
const steps = [
  { ch:'email', day:'Day 0', gap:null,
    reason:'Agent decision: start on the cheapest, least-intrusive channel — Email (~$0.0001).',
    email:{ subject:'Your account is past due — we can help',
      body:'Hi Dana, your account has a past-due balance of <b>$84.00</b>. Reply or we\'ll follow up — we can split it into smaller payments.<div class="badge">📧 Attempt 1 · Email · ~$0.0001</div>' } },

  { ch:'sms', day:'Day 3', gap:'3 days later — email unopened, no reply',
    reason:'No response on email → escalate to SMS (higher reach, read fast, ~$0.0075).',
    out:'Hi Dana, following up on your past-due balance of $84.00. Reply HELP and I\'ll make it easy — pay in full or split into smaller payments.' },

  { ch:'rcs', day:'Day 7', gap:'4 more days — still silent',
    reason:'Still no response → escalate to RCS: branded verified sender, rich media, tap-to-act buttons (~$0.012). Auto-falls back to SMS if the device can\'t render RCS.',
    card:{ sender:'Recovery Agent', verified:true, media:'$84.00', mediaCaption:'PAST DUE',
      title:'Let\'s resolve your balance', body:'No call, no hold — just tap. Your service stays on while you\'re on a plan.',
      replies:['💳 Pay now','📅 Split into payments'], cardActions:['☎ Call me','🙋 I need help'],
      features:['✓ Verified sender','🖼 Rich media','⌨ Typing shown','✓✓ Read receipts','↩ SMS fallback'] },
    receipt:'✓✓ Read · 2:14 PM' },

  { ch:'whatsapp', day:'Day 10', gap:'3 more days — no tap, no reply',
    reason:'No response on cheaper channels + 32 days overdue → escalate to WhatsApp, the richest/most personal channel (~$0.035). Reserved for accounts worth the touch.',
    out:'Hi Dana, it\'s your telecom. I don\'t want your service to pause. I\'m here on WhatsApp whenever it\'s easiest — we can sort your $84.00 balance together, no pressure.',
    reply:'honestly I just lost my job, money is really tight' },

  { ch:'whatsapp', day:null, gap:null, engaged:true,
    reason:'Customer engaged → escalation STOPS. The agent reasons & acts: detects hardship, applies a hold, suppresses fees, confirms by email.',
    tool:'apply_hardship + send_receipt', status:'hardship_hold',
    in:'I\'m really sorry to hear that — thank you for telling me. I\'ve paused everything: no late fees, no interruption. A specialist will follow up to set terms that work for you. You don\'t need to do anything right now.',
    email:{ subject:'Hardship Hold Applied — ACCT-TEL-80231',
      body:'We\'ve paused collection and late fees on your account.<div class="badge">🤝 No service interruption · a specialist will follow up</div>' } },
];

const RUNGS = [
  {ch:'email',t:'Email · Day 0'},{ch:'sms',t:'SMS · Day 3'},{ch:'rcs',t:'RCS · Day 7'},
  {ch:'whatsapp',t:'WhatsApp · Day 10'},{ch:'whatsapp',t:'Resolved'}];
const thread = document.getElementById('thread');
const state = { spend:0, i:-1 };

function renderLadder(){
  const L=document.getElementById('ladder'); L.innerHTML='';
  RUNGS.forEach((r,idx)=>{
    const el=document.createElement('div'); el.className='rung'+(idx===state.i?' active':idx<state.i?' done':'');
    el.innerHTML='<div class="railcol"><span class="dot">'+(idx+1)+'</span><span class="rail"></span></div>'+
      '<div class="meta"><div class="ch">'+LABEL[r.ch]+'</div><div class="day">'+r.t+'</div></div>';
    L.appendChild(el);
  });
}
function buildRichCard(c){
  let h='';
  h+='<div class="rc-sender">'+c.sender+(c.verified?' <span class="rc-verified">✓ Verified</span>':'')+'</div>';
  if(c.media) h+='<div class="rc-media"><div><div class="rc-amt">'+c.media+'</div><div class="rc-cap">'+(c.mediaCaption||'')+'</div></div></div>';
  h+='<div class="rc-head"><div class="t">'+c.title+'</div></div><div class="rc-body">'+c.body+'</div>';
  const r=(c.replies||[]).map(a=>'<span class="chip">'+a+'</span>');
  const a=(c.cardActions||[]).map(x=>'<span class="chip action">'+x+'</span>');
  h+='<div class="rc-actions">'+r.concat(a).join('')+'</div>';
  if(c.features) h+='<div class="rc-feat">'+c.features.map(f=>'<span>'+f+'</span>').join('')+'</div>';
  return h;
}
function phoneFor(s){
  const p=document.createElement('div'); p.className='phone '+s.ch;
  p.innerHTML='<div class="notch"></div><div class="app-bar"><div class="avatar">'+(s.ch==='email'?'📧':'💸')+'</div><div>'+
    (s.ch==='email'?'Inbox':s.ch==='sms'?'Messages':'Recovery Agent')+'<span class="sub">'+SUB[s.ch]+'</span></div></div>';
  const sc=document.createElement('div'); sc.className='screen';
  if(s.tool){ const t=document.createElement('div'); t.className='tool-chip'; t.textContent='⚙ agent → '+s.tool; sc.appendChild(t); }
  if(s.out){ const b=document.createElement('div'); b.className='bubble in'; b.innerHTML='<span class="who">🤖 Recovery Agent</span>'+s.out; sc.appendChild(b); }
  if(s.card){ const c=document.createElement('div'); c.className='rich-card'; c.innerHTML=buildRichCard(s.card); sc.appendChild(c); }
  if(s.receipt){ const r=document.createElement('div'); r.className='rc-receipt'; r.textContent=s.receipt; sc.appendChild(r); }
  if(s.reply){ const b=document.createElement('div'); b.className='bubble out'; b.textContent=s.reply; sc.appendChild(b); }
  if(s.in){ const b=document.createElement('div'); b.className='bubble in'; b.innerHTML='<span class="who">🤖 Recovery Agent</span>'+s.in; sc.appendChild(b); }
  if(s.email){ const e=document.createElement('div'); e.className='email-msg';
    e.innerHTML='<div class="email-head"><div class="av">RA</div><div><div class="name">Recovery Agent</div><div class="addr">recovery@telecom.example</div></div></div><div class="email-subject">'+s.email.subject+'</div><div class="email-body">'+s.email.body+'</div>';
    sc.appendChild(e); }
  p.appendChild(sc);
  if(s.cost!==false && COST[s.ch]!==undefined && !s.engaged){ const ct=document.createElement('div'); ct.className='cost-tag'; ct.textContent='sent via '+LABEL[s.ch]+' · ~$'+COST[s.ch].toFixed(4); sc.appendChild(ct); }
  return p;
}
function renderStep(idx){
  const s=steps[idx];
  if(s.gap){ const d=document.createElement('div'); d.className='divider'; d.innerHTML='<span>⏳ '+s.gap+'</span>'; thread.appendChild(d); }
  const lab=document.createElement('div'); lab.className='step-label';
  lab.innerHTML='<span class="n">Step '+(idx+1)+' of 5</span>'+(s.day?s.day+' · ':'')+(s.engaged?'Customer engaged — ladder stops':LABEL[s.ch]);
  thread.appendChild(lab);
  const r=document.createElement('div'); r.className='reason'; r.textContent=s.reason; thread.appendChild(r);
  if(s.engaged){ const rz=document.createElement('div'); rz.className='resolved'; rz.innerHTML='<div class="t">✅ Resolved on WhatsApp</div><div class="s">Hardship hold applied · fees suppressed · confirmed by email</div>'; thread.appendChild(rz); }
  thread.appendChild(phoneFor(s));
  if(COST[s.ch]!==undefined && !s.engaged) state.spend += COST[s.ch];
  if(s.status) document.getElementById('st-status').textContent=s.status;
  document.getElementById('st-spend').textContent='$'+state.spend.toFixed(4);
}
function syncButtons(){
  document.getElementById('prevBtn').disabled = state.i<=0;
  const n=document.getElementById('nextBtn');
  if(state.i>=steps.length-1){ n.disabled=true; n.textContent='✓ Recovery complete'; }
  else n.textContent = state.i<0 ? 'Step 1 of 5 — Start ›' : 'Step '+(state.i+2)+' of 5 ›';
}
function next(){ if(state.i>=steps.length-1) return; state.i++; renderStep(state.i); renderLadder(); syncButtons();
  thread.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'}); }
function prev(){ if(state.i<=0) return;
  // rebuild from scratch up to i-1 (keeps costs/state honest)
  const target=state.i-1; thread.innerHTML=''; state.spend=0; state.i=-1; document.getElementById('st-status').textContent='past_due';
  for(let k=0;k<=target;k++){ state.i=k; renderStep(k); }
  renderLadder(); syncButtons(); thread.lastElementChild.scrollIntoView({block:'center'}); }
renderLadder(); syncButtons();
if(new URLSearchParams(location.search).get('autoplay')==='1'){ (async()=>{ while(state.i<steps.length-1){ next(); await new Promise(r=>setTimeout(r,1400)); } })(); }
</script>
</body>
</html>
